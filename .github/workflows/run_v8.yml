name: Run Backtest V8

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache XT Futures Market Data
        uses: actions/cache@v4
        with:
          path: data/xt_futures_v4
          key: xt-futures-data-v4-${{ runner.os }}-${{ hashFiles('backtest_v8.py') }}
          restore-keys: |
            xt-futures-data-v4-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests ccxt

      - name: Validate Python File
        run: |
          python -m py_compile backtest_v8.py

      - name: Run Backtest V8
        run: |
          python backtest_v8.py
