name: Run Backtest V8

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Market Data
        uses: actions/cache@v4
        with:
          path: data/xt_futures_v4
          key: xt-futures-data-v4-${{ github.run_id }}
          restore-keys: |
            xt-futures-data-v4-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      - name: Run Backtest V8
        run: |
          python backtest_v8.py
