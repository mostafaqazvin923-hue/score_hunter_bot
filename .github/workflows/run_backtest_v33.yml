name: Run Backtest V33

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Run V33 Stage-0
        run: |
          python v33_spot_perp_leadlag_stage0.py

      - name: Upload V33 trade log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v33-stage0-results
          path: |
            v33_trades.csv
            v33_data/
          if-no-files-found: ignore
          
