name: Run Setup 5 V4

on:
  workflow_dispatch:

jobs:
  backtest:
    name: Setup 5 V4 Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Run Setup 5 V4
        run: |
          python backtest_setup5_v4.py

      - name: Upload Setup 5 V4 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup5-v4-results
          path: |
            setup5_v4_trades.csv
            setup5_v4_candidates.csv
            setup5_v4_oos_by_symbol.csv
          if-no-files-found: ignore
