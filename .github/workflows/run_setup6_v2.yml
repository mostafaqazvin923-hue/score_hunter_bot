name: Run Backtest Setup 6 V2

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Verify Setup 6 V2 file
        run: |
          test -f backtest_setup6_v2.py
          wc -l -c backtest_setup6_v2.py

      - name: Syntax check
        run: python -m py_compile backtest_setup6_v2.py

      - name: Run Setup 6 V2
        run: python backtest_setup6_v2.py

      - name: Upload trade log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup6-v2-trades
          path: setup6_v2_trades.csv
          if-no-files-found: warn
