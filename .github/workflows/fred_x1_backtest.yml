name: FRED-X1 Funding Dislocation Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: Historical days to test (1095 is about 3 years)
        required: true
        default: '1095'
  schedule:
    - cron: '23 4 2 * *'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run FRED-X1 backtest
        env:
          PYTHONUNBUFFERED: '1'
        run: python backtest_fred_x1.py --days "${{ inputs.days || '1095' }}" --out fred_x1_results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fred-x1-backtest-results
          path: fred_x1_results/
          if-no-files-found: error
          retention-days: 30
