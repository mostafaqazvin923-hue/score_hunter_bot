name: FRD-MR Strategy Pipeline

on:
  workflow_dispatch:  # امکان اجرای دستی از طریق پنل گیت‌هاب

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Upgrade Pip and Setup Tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Data Fetching and Validation
      run: |
        python fetch_data.py

    - name: Run Strategy Backtest Engine
      run: |
        python backtest_fred_x1.py

    - name: Check Data Cache and Outputs
      run: |
        echo "بررسی پوشه کش و فایل‌های خروجی..."
        ls -la data_cache/
