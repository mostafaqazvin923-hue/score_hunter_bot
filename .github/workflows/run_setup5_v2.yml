name: Run Setup 5 V2

on:
  workflow_dispatch:

jobs:
  backtest:
    name: Setup 5 V2 Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Run Setup 5 V2
        run: |
          python backtest_setup5_v2.py

      - name: Upload Setup 5 V2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup5-v2-results
          path: |
            setup5_v2_trades.csv
            setup5_v2_candidates.csv
            setup5_v2_oos_by_symbol.csv
          if-no-files-found: ignore
