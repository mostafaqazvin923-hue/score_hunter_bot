name: Score Hunter Bot

on:
  schedule:
    - cron: '*/15 * * * *'  # اجرا خودکار هر ۱۵ دقیقه
  workflow_dispatch:        # قابلیت اجرای دستی

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bot Script
        run: python bot.py
