name: Score Hunter Bot

on:
  workflow_dispatch:

  schedule:
    # Run once every hour, around minute 5
    - cron: "5 * * * *"

concurrency:
  group: score-hunter-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Score Hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save price state
        run: |
          git config user.name "Score Hunter Bot"
          git config user.email "score-hunter-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update price state"
          git push
