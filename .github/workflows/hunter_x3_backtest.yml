name: HUNTER-X3 Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest_hunter_x3.py"
      - ".github/workflows/hunter_x3_backtest.yml"

permissions:
  contents: read

concurrency:
  group: hunter-x3-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas requests
      - name: Validate source file
        run: test -f backtest_hunter_x3.py
      - name: Validate syntax
        run: python -m py_compile backtest_hunter_x3.py
      - name: Run backtest
        run: python -u backtest_hunter_x3.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-x3-results-${{ github.run_number }}
          path: hunter_x3_results/
          if-no-files-found: warn
          retention-days: 30
