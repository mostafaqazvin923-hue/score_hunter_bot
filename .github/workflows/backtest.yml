
name: MarkitTick Futures Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to test"
        required: true
        default: "365"
      symbols:
        description: "Optional space-separated symbols"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backtest
        shell: bash
        env:
          DAYS: ${{ inputs.days }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          if [[ -n "$SYMBOLS" ]]; then
            python backtest_markittick_futures.py --days "$DAYS" --symbols $SYMBOLS
          else
            python backtest_markittick_futures.py --days "$DAYS"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markittick-futures-backtest
          path: |
            backtest_output/
            data/
          if-no-files-found: warn
          retention-days: 30
