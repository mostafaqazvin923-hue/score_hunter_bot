name: Run Backtest CRT Stage-0

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    timeout-minutes: 150

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Run CRT Stage-0
        run: |
          python crt_stage0.py

      - name: Upload CRT results
        uses: actions/upload-artifact@v4
        with:
          name: crt-stage0-results

          path: |
            crt_stage0_trades.csv
            crt_stage0_summary.csv
            crt_stage0_validation_symbols.csv
            crt_stage0_audit.csv
