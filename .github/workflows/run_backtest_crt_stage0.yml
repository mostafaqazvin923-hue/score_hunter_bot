name: Run Backtest CRT Stage-0

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Validate Python syntax
        run: |
          python -m py_compile crt_stage0.py
          echo "======================================"
          echo "Python syntax check: PASS"
          echo "======================================"

      - name: Remove stale outputs
        run: |
          rm -f crt_stage0_trades.csv
          rm -f crt_stage0_summary.csv
          rm -f crt_stage0_validation_symbols.csv
          rm -f crt_stage0_audit.csv

          echo "Old CRT outputs removed."

      - name: Run CRT Stage-0
        run: |
          echo "======================================"
          echo "STARTING CRT STAGE-0"
          echo "======================================"

          python -u crt_stage0.py

      - name: Verify outputs
        run: |
          echo "======================================"
          echo "VERIFYING CRT OUTPUT FILES"
          echo "======================================"

          test -s crt_stage0_trades.csv
          test -s crt_stage0_summary.csv
          test -s crt_stage0_validation_symbols.csv
          test -s crt_stage0_audit.csv

          echo "======================================"
          echo "ALL CRT OUTPUT FILES EXIST"
          echo "======================================"

          ls -lh \
            crt_stage0_trades.csv \
            crt_stage0_summary.csv \
            crt_stage0_validation_symbols.csv \
            crt_stage0_audit.csv

      - name: Upload CRT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crt-stage0-results
          if-no-files-found: warn
          path: |
            crt_stage0_trades.csv
            crt_stage0_summary.csv
            crt_stage0_validation_symbols.csv
            crt_stage0_audit.csv
