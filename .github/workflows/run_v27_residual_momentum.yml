name: Run V27 Residual Momentum Research
on:
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Compile check
        run: python -m py_compile edge_discovery_v27_residual_momentum.py
      - name: Run V27
        run: python edge_discovery_v27_residual_momentum.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: v27-residual-momentum-research
          path: reports/xt_v27_residual_momentum/
          if-no-files-found: error
