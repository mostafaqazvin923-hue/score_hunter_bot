name: Run Backtest Setup 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Setup 2 backtest
        run: |
          python backtest_setup2.py

      - name: Upload trade ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup2-trade-ledger
          path: setup2_trade_ledger.csv
          if-no-files-found: ignore
