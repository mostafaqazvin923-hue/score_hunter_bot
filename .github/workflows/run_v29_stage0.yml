name: Run V29 Stage-0 Liquidity Momentum Research
on:
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install pandas numpy
      - run: python -m py_compile edge_discovery_v29_stage0.py
      - run: python edge_discovery_v29_stage0.py
      - uses: actions/upload-artifact@v4
        with:
          name: v29-stage0-liquidity-momentum
          path: reports/xt_v29_stage0_liquidity_momentum/
          if-no-files-found: error
