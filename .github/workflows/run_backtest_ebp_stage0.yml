name: Run Backtest EBP Stage-0

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Run EBP Stage-0
        run: |
          python ebp_engulfing_bar_play_stage0.py

      - name: Upload EBP results
        uses: actions/upload-artifact@v4
        with:
          name: ebp-stage0-results
          path: |
            ebp_stage0_trades.csv
            ebp_stage0_summary.csv
            ebp_stage0_splits.csv
            ebp_stage0_validation_symbols.csv
