name: Run Backtest Setup 6 V1

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Setup 6 V1
        run: python backtest_setup6_v1.py

      - name: Upload trade log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup6-v1-results
          path: setup6_v1_trades.csv
          if-no-files-found: ignore
