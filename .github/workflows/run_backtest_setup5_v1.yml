name: Run Backtest Setup 5 V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    name: Setup 5 V1 Backtest
    runs-on: ubuntu-latest

    # The previous run reached ~30 minutes and was cancelled.
    # Give the complete 14-symbol backtest enough time.
    timeout-minutes: 120

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Binance data cache
        uses: actions/cache@v4
        with:
          path: .binance_cache
          key: setup5-binance-15m-${{ runner.os }}-${{ hashFiles('backtest_setup5_v1.py') }}
          restore-keys: |
            setup5-binance-15m-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas numpy requests

      - name: Run Setup 5 V1
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u backtest_setup5_v1.py

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup5-v1-results
          path: |
            setup5_v1_trades.csv
          if-no-files-found: ignore
