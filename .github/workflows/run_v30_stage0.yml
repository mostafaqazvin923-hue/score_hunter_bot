name: Run V30 Stage-0 Cross-Asset Spillover Research

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Compile check
        run: |
          python -m py_compile edge_discovery_v30_stage0_cross_asset_spillover.py

      - name: Run V30 Stage-0
        run: |
          python edge_discovery_v30_stage0_cross_asset_spillover.py

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v30-stage0-cross-asset-spillover
          path: reports/xt_v30_stage0_cross_asset_spillover/
          if-no-files-found: error
