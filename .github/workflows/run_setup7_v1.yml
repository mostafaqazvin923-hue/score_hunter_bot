name: Run Backtest Setup 7 V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    name: Setup 7 V1 Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Verify files and syntax
        run: |
          test -f backtest_setup7_v1.py
          wc -l -c backtest_setup7_v1.py
          python -m py_compile backtest_setup7_v1.py

      - name: Run Setup 7 V1
        run: python -u backtest_setup7_v1.py

      - name: Upload Setup 7 V1 trade log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup7-v1-results
          path: setup7_v1_trades.csv
          if-no-files-found: warn
