name: Run V28 Lead-Lag Seesaw Research
on:
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          pip install pandas numpy requests
      - name: Compile check
        run: |
          python -m py_compile edge_discovery_v28_lead_lag.py
      - name: Run V28
        run: |
          python edge_discovery_v28_lead_lag.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: v28-lead-lag-research
          path: reports/xt_v28_lead_lag/
          if-no-files-found: error
