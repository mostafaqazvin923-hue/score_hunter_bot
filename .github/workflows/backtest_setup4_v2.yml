name: Run Backtest Setup 4 V2

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Compile check
        run: |
          python -m py_compile backtest_setup4_v2.py

      - name: Run Setup 4 V2
        run: |
          python backtest_setup4_v2.py

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: setup4-v2-results
          path: setup4_v2_outputs/
