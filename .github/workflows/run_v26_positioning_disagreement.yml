name: Run V26 Positioning Disagreement Research

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Compile check
        run: |
          python -m py_compile edge_discovery_v26_positioning_disagreement.py

      - name: Run V26
        run: |
          python edge_discovery_v26_positioning_disagreement.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: v26-positioning-disagreement-research
          path: reports/xt_v26_positioning_disagreement/
          if-no-files-found: error
