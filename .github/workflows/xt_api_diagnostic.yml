name: XT Funding Pagination Diagnostic

on:
  workflow_dispatch:

jobs:
  pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Inspect XT funding pagination
        shell: bash
        run: |
          python - <<'PY'
          import requests
          import json
          import time
          from datetime import datetime, timezone

          BASE = "https://fapi.xt.com"
          URL = f"{BASE}/future/market/v1/public/q/funding-rate-record"
          SYMBOL = "btc_usdt"
          TIMEOUT = 10

          def ts(v):
              try:
                  return datetime.fromtimestamp(int(v)/1000, tz=timezone.utc).isoformat()
              except Exception:
                  return str(v)

          def get(params):
              r = requests.get(URL, params=params, timeout=TIMEOUT)
              print("HTTP:", r.status_code, "params:", params)
              r.raise_for_status()
              return r.json()

          print("=== XT FUNDING PAGINATION INSPECTOR ===")

          first = get({
              "symbol": SYMBOL,
              "limit": 100,
              "direction": "PREV"
          })

          result = first.get("result", {})
          items = result.get("items", []) if isinstance(result, dict) else []

          print("\nRESULT KEYS:", list(result.keys()) if isinstance(result, dict) else type(result))
          print("ITEM COUNT:", len(items))
          print("PAGE FLAGS:", {
              k: result.get(k)
              for k in ("hasPrev", "hasNext", "nextId", "prevId", "next", "prev", "cursor")
              if isinstance(result, dict) and k in result
          })

          if not items:
              raise RuntimeError("First page returned no items")

          print("\nFIRST ITEM:")
          print(json.dumps(items[0], indent=2)[:3000])

          print("\nLAST ITEM:")
          print(json.dumps(items[-1], indent=2)[:3000])

          ids = [str(x.get("id")) for x in items if x.get("id") is not None]
          times = [int(x["createdTime"]) for x in items if x.get("createdTime") is not None]

          print("\nFIRST ID:", ids[0] if ids else None)
          print("LAST ID:", ids[-1] if ids else None)

          if times:
              print("NEWEST:", ts(max(times)))
              print("OLDEST:", ts(min(times)))

          # Test the two plausible PREV cursor directions using actual IDs.
          candidates = []
          if ids:
              candidates.append(("PREV_WITH_FIRST_ID", "PREV", ids[0]))
              candidates.append(("PREV_WITH_LAST_ID", "PREV", ids[-1]))

          # Also test NEXT using both IDs. We do NOT use these for the backtest;
          # this run only discovers which pagination semantics XT actually implements.
          if ids:
              candidates.append(("NEXT_WITH_FIRST_ID", "NEXT", ids[0]))
              candidates.append(("NEXT_WITH_LAST_ID", "NEXT", ids[-1]))

          print("\n=== CURSOR EXPERIMENTS ===")

          for name, direction, cursor in candidates:
              data = get({
                  "symbol": SYMBOL,
                  "limit": 100,
                  "direction": direction,
                  "id": cursor,
              })

              res = data.get("result", {})
              its = res.get("items", []) if isinstance(res, dict) else []

              new_ids = [str(x.get("id")) for x in its if x.get("id") is not None]
              new_times = [int(x["createdTime"]) for x in its if x.get("createdTime") is not None]

              overlap = len(set(ids) & set(new_ids))

              print(f"\n{name}")
              print("returned:", len(its))
              print("overlap_with_page1:", overlap)
              print("hasPrev:", res.get("hasPrev") if isinstance(res, dict) else None)
              print("hasNext:", res.get("hasNext") if isinstance(res, dict) else None)
              print("first_id:", new_ids[0] if new_ids else None)
              print("last_id:", new_ids[-1] if new_ids else None)
              print("newest:", ts(max(new_times)) if new_times else None)
              print("oldest:", ts(min(new_times)) if new_times else None)

          print("\n================================")
          print("DIAGNOSTIC COMPLETE")
          print("Use this output to select the exact XT cursor semantics.")
          print("NO 365-DAY DOWNLOAD WAS ATTEMPTED.")
          print("================================")
          PY
