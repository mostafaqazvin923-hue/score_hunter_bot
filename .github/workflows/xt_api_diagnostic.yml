name: XT Funding Time-Range Diagnostic

on:
  workflow_dispatch:

jobs:
  funding-range:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test XT funding with time ranges
        shell: bash
        run: |
          python - <<'PY'
          import requests
          import time
          from datetime import datetime, timezone

          URL = "https://fapi.xt.com/future/market/v1/public/q/funding-rate-record"
          SYMBOL = "btc_usdt"
          LIMIT = 1000
          REQUEST_TIMEOUT = 10
          GLOBAL_TIMEOUT = 60

          started = time.monotonic()
          session = requests.Session()
          now_ms = int(time.time() * 1000)

          def fmt(ms):
              return datetime.fromtimestamp(ms / 1000, tz=timezone.utc).isoformat()

          def test_range(name, start_ms, end_ms):
              if time.monotonic() - started >= GLOBAL_TIMEOUT:
                  raise TimeoutError("Global timeout")

              params = {
                  "symbol": SYMBOL,
                  "limit": LIMIT,
                  "since": start_ms,
                  "endTime": end_ms,
              }

              print(f"\n=== {name} ===")
              print("since:", fmt(start_ms))
              print("endTime:", fmt(end_ms))

              t0 = time.monotonic()
              r = session.get(URL, params=params, timeout=REQUEST_TIMEOUT)
              elapsed = time.monotonic() - t0

              print("HTTP:", r.status_code)
              print("request_time:", f"{elapsed:.2f}s")
              print("url:", r.url)
              r.raise_for_status()

              js = r.json()
              result = js.get("result", {})
              items = result.get("items", []) if isinstance(result, dict) else []

              print("items:", len(items))
              print(
                  "result keys:",
                  list(result.keys()) if isinstance(result, dict) else []
              )

              if not items:
                  print("EMPTY RANGE")
                  return []

              times = [
                  int(x["createdTime"])
                  for x in items
                  if x.get("createdTime") is not None
              ]

              if times:
                  print("oldest:", fmt(min(times)))
                  print("newest:", fmt(max(times)))

              print("hasPrev:", result.get("hasPrev"))
              print("hasNext:", result.get("hasNext"))

              return items

          print("=== XT FUNDING TIME-RANGE DIAGNOSTIC ===")
          print("BTC funding endpoint; no ID pagination is used.")

          ranges = [
              ("RECENT_30D", now_ms - 30 * 86400000, now_ms),
              (
                  "DAYS_31_60",
                  now_ms - 60 * 86400000,
                  now_ms - 30 * 86400000 - 1,
              ),
              (
                  "DAYS_61_90",
                  now_ms - 90 * 86400000,
                  now_ms - 60 * 86400000 - 1,
              ),
          ]

          all_ids = set()
          all_times = []

          for name, start_ms, end_ms in ranges:
              items = test_range(name, start_ms, end_ms)

              for item in items:
                  item_id = str(item.get("id", ""))
                  if item_id:
                      all_ids.add(item_id)

                  if item.get("createdTime") is not None:
                      all_times.append(int(item["createdTime"]))

          print("\n================================")
          print("RESULT")
          print("Unique IDs:", len(all_ids))
          print("Total timestamps:", len(all_times))

          if all_times:
              print("Overall oldest:", fmt(min(all_times)))
              print("Overall newest:", fmt(max(all_times)))

          print("Elapsed:", f"{time.monotonic() - started:.2f}s")
          print("================================")

          if not all_times:
              raise RuntimeError(
                  "Timestamp-range requests returned no funding records"
              )

          print("XT FUNDING TIME-RANGE DIAGNOSTIC: PASSED")
          PY
