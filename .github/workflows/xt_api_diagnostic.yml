name: XT API Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test XT API
        shell: bash
        run: |
          python - <<'PY'
          import requests
          import time
          import sys

          BASE = "https://fapi.xt.com"
          TIMEOUT = 10
          started = time.monotonic()

          def check_time():
              if time.monotonic() - started > 60:
                  raise TimeoutError("GLOBAL TIMEOUT: diagnostic exceeded 60 seconds")

          def request(name, url, params=None):
              check_time()
              print(f"\n=== {name} ===")
              print("URL:", url)
              print("PARAMS:", params)

              t = time.monotonic()
              r = requests.get(url, params=params, timeout=TIMEOUT)
              elapsed = time.monotonic() - t

              print("HTTP:", r.status_code)
              print("TIME:", f"{elapsed:.2f}s")

              r.raise_for_status()
              data = r.json()

              print("RESPONSE TYPE:", type(data).__name__)
              return data

          try:
              # 1) Symbol list
              data = request(
                  "SYMBOL LIST",
                  f"{BASE}/future/market/v1/public/symbol/list"
              )

              result = data.get("result", data)

              symbols = []
              if isinstance(result, list):
                  symbols = result
              elif isinstance(result, dict):
                  items = result.get("items", [])
                  if isinstance(items, list):
                      symbols = items

              print("SYMBOL COUNT:", len(symbols))

              if not symbols:
                  raise RuntimeError("Symbol list returned no symbols")

              # Find BTC/USDT
              btc = None

              for item in symbols:
                  if isinstance(item, dict):
                      s = str(
                          item.get("symbol")
                          or item.get("name")
                          or ""
                      ).lower()

                      if s in ("btc_usdt", "btc/usdt", "btcusdt"):
                          btc = s
                          break

              if btc is None:
                  # Fallback to known XT symbol format
                  btc = "btc_usdt"

              print("BTC SYMBOL:", btc)

              # 2) 15m Kline — approximately last 24 hours
              now_ms = int(time.time() * 1000)
              start_ms = now_ms - 24 * 60 * 60 * 1000

              kline = request(
                  "BTC 15M KLINE",
                  f"{BASE}/future/market/v1/public/q/kline",
                  {
                      "symbol": btc,
                      "interval": "15m",
                      "startTime": start_ms,
                      "endTime": now_ms,
                      "limit": 1500,
                  }
              )

              kresult = kline.get("result", kline)

              if isinstance(kresult, dict):
                  kitems = kresult.get("items", [])
              elif isinstance(kresult, list):
                  kitems = kresult
              else:
                  kitems = []

              print("KLINE ROWS:", len(kitems))

              if len(kitems) == 0:
                  raise RuntimeError("Kline API returned 0 rows")

              # 3) One Funding History request only
              funding = request(
                  "BTC FUNDING HISTORY - ONE PAGE ONLY",
                  f"{BASE}/future/market/v1/public/q/funding-rate-record",
                  {
                      "symbol": btc,
                      "limit": 100,
                      "direction": "PREV",
                  }
              )

              fresult = funding.get("result", funding)

              if isinstance(fresult, dict):
                  fitems = fresult.get("items", [])
              elif isinstance(fresult, list):
                  fitems = fresult
              else:
                  fitems = []

              print("FUNDING ROWS:", len(fitems))

              if len(fitems) == 0:
                  raise RuntimeError("Funding API returned 0 rows")

              elapsed_total = time.monotonic() - started

              print("\n================================")
              print("XT API DIAGNOSTIC: PASSED")
              print("KLINE ROWS:", len(kitems))
              print("FUNDING ROWS:", len(fitems))
              print("TOTAL TIME:", f"{elapsed_total:.2f}s")
              print("================================")

          except Exception as e:
              print("\n================================")
              print("XT API DIAGNOSTIC: FAILED")
              print("ERROR:", repr(e))
              print("================================")
              sys.exit(1)
          PY
