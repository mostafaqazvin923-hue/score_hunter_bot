name: XT BTC Funding 365D Test

on:
  workflow_dispatch:

jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download BTC funding history for 365 days
        shell: bash
        run: |
          python - <<'PY'
          import requests
          import time
          from datetime import datetime, timezone

          BASE = "https://fapi.xt.com"
          URL = f"{BASE}/future/market/v1/public/q/funding-rate-record"
          SYMBOL = "btc_usdt"
          LIMIT = 100
          DAYS = 365
          MAX_PAGES = 20
          GLOBAL_TIMEOUT = 90
          REQUEST_TIMEOUT = 10

          started = time.monotonic()
          session = requests.Session()

          now_ms = int(time.time() * 1000)
          target_ms = now_ms - DAYS * 86400 * 1000

          rows = []
          seen_ids = set()

          def dt(ms):
              return datetime.fromtimestamp(int(ms) / 1000, tz=timezone.utc).isoformat()

          def fetch(params):
              if time.monotonic() - started >= GLOBAL_TIMEOUT:
                  raise TimeoutError("Global timeout exceeded")
              r = session.get(URL, params=params, timeout=REQUEST_TIMEOUT)
              print("HTTP:", r.status_code, "time:", f"{r.elapsed.total_seconds():.2f}s")
              r.raise_for_status()
              return r.json()

          print("=== XT BTC FUNDING 365D TEST ===")

          # Page 1 establishes the cursor.
          data = fetch({
              "symbol": SYMBOL,
              "limit": LIMIT,
              "direction": "PREV",
          })

          result = data.get("result", {})
          items = result.get("items", [])

          if not items:
              raise RuntimeError("Page 1 returned no funding records")

          for item in items:
              item_id = str(item.get("id", ""))
              if item_id and item_id not in seen_ids:
                  seen_ids.add(item_id)
                  rows.append(item)

          print("PAGE 1:", len(items), "records")
          print("FIRST ID:", items[0].get("id"))
          print("LAST ID:", items[-1].get("id"))

          # Diagnostic #3 proved that NEXT + FIRST_ID moves backward in time.
          cursor = str(items[0].get("id"))

          for page in range(2, MAX_PAGES + 1):
              if time.monotonic() - started >= GLOBAL_TIMEOUT:
                  raise TimeoutError("Global timeout exceeded")

              data = fetch({
                  "symbol": SYMBOL,
                  "limit": LIMIT,
                  "direction": "NEXT",
                  "id": cursor,
              })

              result = data.get("result", {})
              items = result.get("items", [])

              if not items:
                  print("No more items.")
                  break

              new_count = 0
              for item in items:
                  item_id = str(item.get("id", ""))
                  if item_id and item_id not in seen_ids:
                      seen_ids.add(item_id)
                      rows.append(item)
                      new_count += 1

              times = [
                  int(x["createdTime"])
                  for x in rows
                  if x.get("createdTime") is not None
              ]

              oldest = min(times) if times else None

              print(
                  f"PAGE {page}: returned={len(items)} "
                  f"new={new_count} total={len(rows)} "
                  f"oldest={dt(oldest) if oldest else 'N/A'}"
              )

              if oldest is not None and oldest <= target_ms:
                  print("365-DAY TARGET REACHED.")
                  break

              next_cursor = str(items[0].get("id", ""))

              if not next_cursor or next_cursor == cursor:
                  raise RuntimeError("Pagination cursor did not advance")

              cursor = next_cursor

          times = [
              int(x["createdTime"])
              for x in rows
              if x.get("createdTime") is not None
          ]

          if not times:
              raise RuntimeError("No valid funding timestamps collected")

          oldest = min(times)
          newest = max(times)
          coverage_days = (newest - oldest) / 86400000
          elapsed = time.monotonic() - started

          print()
          print("================================")
          print("RESULT")
          print("Unique records:", len(rows))
          print("Coverage days:", f"{coverage_days:.1f}")
          print("Oldest:", dt(oldest))
          print("Newest:", dt(newest))
          print("Elapsed:", f"{elapsed:.2f}s")
          print("Target reached:", oldest <= target_ms)
          print("================================")

          if oldest > target_ms:
              raise RuntimeError("365-day target NOT reached within page limit")

          print("XT BTC FUNDING 365D TEST: PASSED")
          PY
