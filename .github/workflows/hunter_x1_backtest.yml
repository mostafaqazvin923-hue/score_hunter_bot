
name: HUNTER-X1 Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest_hunter_x1.py"
      - "requirements.txt"
      - ".github/workflows/hunter_x1_backtest.yml"

permissions:
  contents: read

concurrency:
  group: hunter-x1-backtest
  cancel-in-progress: false

jobs:
  backtest:
    name: Run HUNTER-X1
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile backtest_hunter_x1.py

      - name: Run HUNTER-X1 backtest
        run: python -u backtest_hunter_x1.py

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-x1-results-${{ github.run_number }}
          path: hunter_x1_results/
          if-no-files-found: warn
          retention-days: 30
