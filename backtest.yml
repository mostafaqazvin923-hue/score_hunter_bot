name: Run Backtest V8

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy

      - name: Check files
        run: |
          echo "Repository files:"
          ls -la
          echo ""
          echo "Checking backtest_v8.py..."
          test -f backtest_v8.py
          echo "✅ backtest_v8.py found"

      - name: Run backtest
        run: |
          echo "🚀 Starting backtest_v8.py..."
          python backtest_v8.py
          echo "✅ Backtest completed"
