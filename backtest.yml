name: Run Backtest V8

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy

      - name: Verify Backtest File
        run: |
          echo "=== Repository Files ==="
          ls -la
          echo "=== Checking backtest_v8.py ==="
          test -f backtest_v8.py
          echo "backtest_v8.py FOUND"

      - name: Run Backtest V8
        run: |
          echo "=== STARTING BACKTEST V8 ==="
          python backtest_v8.py
          echo "=== BACKTEST FINISHED ==="
